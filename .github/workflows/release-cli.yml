name: Release CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "Invalid version: $VERSION"
            echo "Expected semver format, e.g. 0.1.0 or 1.0.0-beta.1"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run test

      - run: bun run --filter @meawhooks/cli build:binary

      - name: Verify binary
        run: |
          test -f apps/cli/dist/meawhooks-linux-x64
          test -x apps/cli/dist/meawhooks-linux-x64
          ls -lh apps/cli/dist/meawhooks-linux-x64

      - name: Smoke test binary
        run: |
          set +e
          output=$(apps/cli/dist/meawhooks-linux-x64 2>&1)
          exit_code=$?
          set -e
          echo "$output"
          if [ "$exit_code" -ne 1 ]; then
            echo "Expected exit code 1 (usage), got $exit_code"
            exit 1
          fi
          echo "$output" | grep -q "Usage: meawhooks listen"

      - name: Generate SHA256 checksum
        run: |
          cd apps/cli/dist
          sha256sum meawhooks-linux-x64 > meawhooks-linux-x64.sha256
          cat meawhooks-linux-x64.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cli-v${{ inputs.version }}
          name: meawhooks CLI v${{ inputs.version }}
          generate_release_notes: true
          make_latest: true
          body: |
            ## Installation (Linux x64)

            ```bash
            curl -LO https://github.com/${{ github.repository }}/releases/download/cli-v${{ inputs.version }}/meawhooks-linux-x64
            curl -LO https://github.com/${{ github.repository }}/releases/download/cli-v${{ inputs.version }}/meawhooks-linux-x64.sha256
            sha256sum -c meawhooks-linux-x64.sha256
            chmod +x meawhooks-linux-x64
            sudo mv meawhooks-linux-x64 /usr/local/bin/meawhooks
            ```

            ## Usage

            ```bash
            meawhooks listen --tunnel my-app http://localhost:8080/webhooks
            ```
          files: |
            apps/cli/dist/meawhooks-linux-x64
            apps/cli/dist/meawhooks-linux-x64.sha256
